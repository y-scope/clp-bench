system_metric:
  enable: true
  memory:
    ingest_polling_interval: 5
    run_query_benchmark_polling_interval: 5

container_id: mongodb-clp-bench
assets_path: /home/assets
datasets_path: /home/datasets/mongod.log
hot_run_warm_up_times: 3
related_processes:
  - mongod
  - mongosh
  - mongoimport
  - mongoexport
queries:
  - '''{ "attr.tickets": { "$exists": true}}'''
  - '''{"id": {"$eq": 22419}}'''
  - >
    '{"attr.message.msg": {"$regex": "^log_release"}, "attr.message.session_name": "connection"}'
  - >
    '{"ctx": "initandlisten", "$or": [{"msg": {"$exists": true, "$ne": "WiredTiger message"}}, {
    "attr.message.msg": {"$regex": "^log_remove"}}]}'
  - '''{"c": "WTWRTLOG", "attr.message.ts_sec": {"$gt": 1679490000}}'''
  - '''{"ctx": "FlowControlRefresher", "attr.numTrimmed": {"$eq": 0}}'''
