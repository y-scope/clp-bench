system_metric:
  enable: true
  memory:
    ingest_polling_interval: 5
    run_query_benchmark_polling_interval: 5

container_id: elasticsearch-clp-bench
assets_path: /home/assets
datasets_path: /home/datasets/worker*/worker*/*log*
hot_run_warm_up_times: 3
related_processes:
  - /usr/share/elasticsearch/jdk/bin/java
  - /usr/share/elasticsearch/modules/x-pack-ml/platform/linux-x86_64/bin/controller
queries:
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " org.apache.hadoop.hdfs.server.common.Storage: Analyzing storage directories for bpid "}}}}, 
    "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " org.apache.hadoop.hdfs.server.datanode.DataNode: DataTransfer, at "}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " INFO org.apache.hadoop.yarn.server.nodemanager.containermanager.container.ContainerImpl:
    Container "}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " DEBUG org.apache.hadoop.mapred.ShuffleHandler: verifying request. enc_str="}}}}, 
    "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " to pid 21177 as user "}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " 10000 reply: "}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " 10 reply: "}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " 178.2 MB "}}}}, "size": 10000}'
  - > 
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " 1.9 GB "}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    "job_1528179349176_24837"}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    "blk_1075089282_1348458"}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    "hdfs://master:8200/HiBench/Bayes/temp/worddict"}}}}, "size": 10000}'
  - >
    '{"query": {"bool": {"must": {"match_phrase": {"log_line":
    " abcde "}}}}, "size": 10000}'
